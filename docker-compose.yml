version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: laptopstore-db
    environment:
      POSTGRES_DB: laptop_store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5439:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d laptop_store"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: laptopstore-api
    command: sh -c "npm run prisma:migrate && npm run prisma:seed && npm run start"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/laptop_store?schema=public
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
