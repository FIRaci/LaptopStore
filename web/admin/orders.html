<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Orders | Admin</title>
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body>
    <aside class="admin-sidebar">
      <div class="admin-brand">
        <div class="brand">
          <span class="brand-mark">LS</span>
          <div class="brand-title">Admin</div>
        </div>
      </div>
      <nav class="admin-nav">
        <a href="/admin/index.html" class="admin-nav-item">Dashboard</a>
        <a href="/admin/products.html" class="admin-nav-item">Products</a>
        <a href="/admin/orders.html" class="admin-nav-item active">Orders</a>
      </nav>
      <div style="margin-top: auto; padding: 0 16px;">
        <div style="margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem;" id="adminUserName"></div>
        <a href="/" class="admin-nav-item">Back to Store</a>
        <button id="adminLogoutBtn" class="btn btn-ghost" style="width: 100%; margin-top: 8px;">Logout</button>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <h1>Orders</h1>
      </header>
      
      <div class="admin-card">
        <div style="margin-bottom: 24px;">
          <input type="text" id="orderSearch" class="inline-input" placeholder="Search orders by customer email..." style="max-width: 400px; padding: 12px 16px; border-radius: 8px;" />
        </div>

        <div class="table-responsive">
          <table class="data-table" id="ordersTable">
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Total</th>
                <th>Date</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              <!-- Populated by JS -->
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script type="module" src="./js/orders.js"></script>
  </body>
</html>
