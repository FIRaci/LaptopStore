<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Products | Admin</title>
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body>
    <aside class="admin-sidebar">
      <div class="admin-brand">
        <div class="brand">
          <span class="brand-mark">LS</span>
          <div class="brand-title">Admin</div>
        </div>
      </div>
      <nav class="admin-nav">
        <a href="/admin/index.html" class="admin-nav-item">Dashboard</a>
        <a href="/admin/products.html" class="admin-nav-item active">Products</a>
        <a href="/admin/orders.html" class="admin-nav-item">Orders</a>
      </nav>
      <div style="margin-top: auto; padding: 0 16px;">
        <div style="margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem;" id="adminUserName"></div>
        <a href="/" class="admin-nav-item">Back to Store</a>
        <button id="adminLogoutBtn" class="btn btn-ghost" style="width: 100%; margin-top: 8px;">Logout</button>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <h1>Products</h1>
        <button id="addProductBtn" class="btn btn-primary">+ Add New Product</button>
      </header>

      <div class="admin-card">
        <div style="margin-bottom: 24px;">
          <input type="text" id="productSearch" class="inline-input" placeholder="Search products by name or SKU..." style="max-width: 400px; padding: 12px 16px; border-radius: 8px;" />
        </div>
        
        <div class="table-responsive">
          <table class="data-table" id="productsTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>SKU</th>
                <th>Name</th>
                <th>Type</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <!-- Populated by JS -->
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Add Product Modal (Keep modal just for adding new products) -->
    <div id="addModal" class="modal-overlay">
      <div class="modal-content" style="max-width: 600px; padding: 32px;">
        <button id="addModalClose" class="modal-close" aria-label="Close modal">
          <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
        <h2 style="margin-bottom: 24px;">Add New Product</h2>
        <form id="addForm" class="auth-form">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="input-group"><label>Name</label><input type="text" id="addName" required /></div>
            <div class="input-group"><label>SKU</label><input type="text" id="addSku" required /></div>
            <div class="input-group"><label>Brand</label><input type="text" id="addBrand" required /></div>
            <div class="input-group">
              <label>Type</label>
              <select id="addType" required style="background: var(--bg-base); border: 1px solid var(--border); color: var(--text-main); padding: 12px 16px; border-radius: 8px;">
                <option value="LAPTOP">LAPTOP</option>
                <option value="GEAR">GEAR</option>
                <option value="COMPONENT">COMPONENT</option>
              </select>
            </div>
            <div class="input-group"><label>Price</label><input type="number" id="addPrice" required min="0" step="0.01" /></div>
            <div class="input-group"><label>Stock</label><input type="number" id="addStock" required min="0" /></div>
          </div>
          <div class="input-group"><label>Description</label><input type="text" id="addDesc" /></div>
          <div class="input-group"><label>Image URL</label><input type="text" id="addImage" value="/images/creator_laptop.png" /></div>
          <button class="btn btn-primary auth-submit" type="submit">Add Product</button>
        </form>
      </div>
    </div>

    <script type="module" src="./js/products.js"></script>
  </body>
</html>
